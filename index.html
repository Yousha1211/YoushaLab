<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A1526">
  <title>YoushaLab</title>

  <!-- Ubuntu is the UI font. Noto Sans Bengali only supplies glyphs if Bengali text appears. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&family=Noto+Sans+Bengali:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       DESIGN TOKENS — iOS-style dark navy productivity palette
       ============================================================ */
    :root{
      --bg:#060D18;                 /* page background */
      --surface:#0E1A2C;            /* grouped surfaces: cards + inset lists */
      --surface-hover:#132238;      /* row hover */
      --elevated:#17283F;           /* sheets, popovers, inputs */
      --separator:rgba(255,255,255,0.08);

      --text:#F2F5FA;               /* primary */
      --secondary:rgba(235,240,250,0.72);  /* brighter for reliable sidebar contrast */
      --tertiary:rgba(235,240,250,0.60);   /* 5.6:1+ on surfaces */

      --accent:#0A84FF;             /* fills: charts, dots, active row background */
      --accent-strong:#0071E3;      /* primary button fill: white text = 4.7:1 */
      --accent-text:#5AA9FF;        /* accent tint for text/icons: 5.8:1+ on dark */
      --green:#30D158;              /* on track / done */
      --yellow:#FFD60A;             /* due within 7 days */
      --red:#FF453A;                /* overdue (dots/bars only) */
      --red-text:#FF6961;           /* red tint for text: 5.3:1+ on elevated */
      --green-soft:rgba(48,209,88,0.12);
      --yellow-soft:rgba(255,214,10,0.12);
      --red-soft:rgba(255,69,58,0.12);

      --header-bg:#0A1526;
      --header-border:rgba(255,255,255,0.08);
      --header-text:#F2F5FA;

      --radius-card:12px;
      --radius-input:8px;
      --header-h:56px;
      --sidebar-w:240px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:'Ubuntu','Noto Sans Bengali',system-ui,sans-serif;
      font-size:17px;
      line-height:1.45;
      color:var(--text);
      background:var(--bg);
      min-height:100vh;
      font-variant-numeric:tabular-nums;
      color-scheme:dark;
      -webkit-font-smoothing:antialiased;
    }
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    [hidden]{display:none !important}
    .num{font-variant-numeric:tabular-nums}
    /* Bengali fallback: only affects explicitly Bangla-tagged content or Bengali glyphs. */
    :lang(bn),.bn{font-family:'Noto Sans Bengali','Ubuntu',sans-serif}
    .muted{color:var(--secondary)}
    .tertiary{color:var(--tertiary)}
    .small{font-size:13px}
    .group-label{
      font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
      color:var(--tertiary);padding:18px 22px 6px;
    }

    /* ---------- Header: logo + wordmark only, no buttons ---------- */
    .app-header{
      height:var(--header-h);background:var(--header-bg);
      border-bottom:1px solid var(--header-border);
      display:flex;align-items:center;padding:0 16px;position:sticky;top:0;z-index:40;
    }
    .brand{display:flex;align-items:center;gap:10px}
    .brand img{height:28px;width:auto;display:block}
    .brand-name{display:flex;gap:0;white-space:nowrap}
    .brand-thin{font-weight:400}   /* Ubuntu regular — not a hairline */
    .brand-bold{font-weight:700}
    .brand-thin,.brand-bold{color:var(--header-text);font-size:22px;letter-spacing:-.015em;line-height:1}

    /* ---------- App shell: sidebar + main ---------- */
    .app-shell{display:flex;min-height:calc(100vh - var(--header-h))}
    .sidebar{
      width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
      background:rgba(9,19,34,0.96);   /* near-opaque: predictable text contrast */
      -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
      border-right:1px solid var(--separator);
      position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));
      display:flex;flex-direction:column;z-index:20;
    }
    .sidebar nav{flex:1;overflow-y:auto;padding-top:4px}
    .nav-row{
      display:flex;align-items:center;gap:11px;width:calc(100% - 20px);
      margin:2px 10px;padding:9px 12px;min-height:40px;
      background:transparent;border:0;border-radius:8px;color:var(--secondary);
      text-align:left;font-size:15px;
      transition:background .2s ease,opacity .2s ease,color .2s ease;
    }
    .nav-row:hover{background:var(--surface-hover)}
    .nav-row.active{background:rgba(10,132,255,0.16);color:var(--accent-text)}
    .nav-row svg{flex:0 0 auto;opacity:.9}
    .sidebar-footer{border-top:1px solid var(--separator);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}

    .main{flex:1;min-width:0;padding:28px clamp(16px,4vw,40px) 64px}
    .main-inner{max-width:1180px;margin:0 auto}

    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
    .large-title{font-size:34px;font-weight:700;letter-spacing:-.025em;margin:0;color:var(--text)}
    .section-sub{margin:6px 0 0;font-size:13px;color:var(--secondary)}
    .head-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

    /* ---------- Dashboard grid ---------- */
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;align-items:start}
    /* Dashboard: a deliberate 2-column arrangement instead of an auto-fit shuffle */
    .dash-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:stretch}
    .dash-grid .panel-wide{grid-column:1 / -1}
    .stat-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:20px}

    /* ---------- Surfaces ---------- */
    .card,.panel,.inset{
      background:var(--surface);border:1px solid var(--separator);border-radius:var(--radius-card);
    }
    .panel{padding:18px}
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .panel-head h2{font-size:17px;font-weight:600;margin:0;display:flex;align-items:center;gap:9px}
    .panel-head .panel-icon{color:var(--accent-text);display:inline-flex}
    .inkset{background:transparent}

    .inset{overflow:hidden}
    .inset-row{
      display:flex;align-items:center;gap:12px;width:100%;
      padding:13px 15px;background:transparent;border:0;border-bottom:1px solid var(--separator);
      text-align:left;color:var(--text);font-size:15px;
      transition:background .2s ease,opacity .2s ease;
    }
    .inset-row:last-child{border-bottom:0}
    .inset-row:hover{background:var(--surface-hover)}
    .inset-row.static{cursor:default}
    .inset-row.static:hover{background:transparent}
    .row-main{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .row-sub{font-size:13px;color:var(--secondary)}
    .row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%}
    .row-right{display:flex;align-items:center;gap:10px;flex:0 0 auto}

    /* ---------- Buttons & links ---------- */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:7px;
      min-height:38px;padding:8px 14px;border-radius:var(--radius-input);
      border:1px solid transparent;font-size:14px;font-weight:600;
      transition:background .2s ease,opacity .2s ease,transform .1s ease;
    }
    .btn:active,.tappable:active,.nav-row:active,.tab:active,.inset-row:active,.step-btn:active{opacity:.6}
    .btn.primary{background:var(--accent-strong);color:#fff}
    .btn.primary:hover{background:#0067D1}
    .btn.ghost{background:rgba(255,255,255,0.06);border-color:var(--separator);color:var(--text)}
    .btn.ghost:hover{background:var(--surface-hover)}
    .btn.danger{background:var(--red-soft);color:var(--red-text);border-color:rgba(255,69,58,0.25)}
    .btn.small{min-height:30px;padding:5px 10px;font-size:13px}
    .btn.block{width:100%}
    .link-btn{
      background:none;border:0;color:var(--accent-text);font-size:14px;font-weight:600;
      padding:6px 2px;transition:opacity .2s ease;
    }
    .link-btn:hover{text-decoration:underline}
    .tappable{transition:opacity .2s ease,background .2s ease}
    .highlight{outline:1px solid rgba(10,132,255,.55);background:rgba(10,132,255,.10) !important;border-radius:8px}
    .icon-btn{
      display:inline-flex;align-items:center;justify-content:center;
      width:30px;height:30px;border-radius:8px;border:1px solid transparent;
      background:transparent;color:var(--secondary);transition:background .2s ease,opacity .2s ease;
    }
    .icon-btn:hover{background:var(--surface-hover);color:var(--text)}
    .row-actions{display:inline-flex;gap:2px;flex:0 0 auto}

    /* ---------- Inputs / forms ---------- */
    .search{
      background:var(--elevated);border:1px solid var(--separator);border-radius:var(--radius-input);
      padding:9px 12px;min-height:38px;font-size:14px;color:var(--text);min-width:180px;
    }
    .search::placeholder,.input::placeholder,textarea::placeholder{color:var(--tertiary)}
    .fields{display:grid;gap:14px;padding-top:4px}
    .field{display:grid;gap:6px}
    .field>span{font-size:13px;color:var(--secondary)}
    .input,textarea,select.input{
      width:100%;background:var(--elevated);border:1px solid var(--separator);
      border-radius:var(--radius-input);padding:10px 12px;font-size:16px;color:var(--text);
    }
    textarea{min-height:86px;resize:vertical}
    .form-error{color:var(--red-text);font-size:13px;min-height:18px;margin-top:2px}
    .form-notice{color:var(--green);font-size:13px;margin:4px 0}

    /* iOS segmented control */
    .segmented{
      display:flex;gap:2px;background:var(--surface);border:1px solid var(--separator);
      border-radius:9px;padding:3px;overflow-x:auto;
    }
    .seg{flex:1 0 auto;position:relative}
    .seg input{position:absolute;opacity:0;width:0;height:0}
    .seg span{
      display:block;text-align:center;padding:7px 12px;border-radius:7px;
      font-size:13px;color:var(--secondary);white-space:nowrap;transition:background .2s ease,color .2s ease;
    }
    .seg input:checked+span{background:var(--elevated);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.25)}
    .seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
    .segmented.filter{margin-bottom:16px}

    /* ---------- Charts & bars ---------- */
    .donut{display:block;flex:0 0 auto}
    .bar{width:100%;background:rgba(255,255,255,0.08);border-radius:99px;overflow:hidden}
    .bar-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}
    .dot,.section-dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--accent)}
    .section-dot.chapter{background:var(--accent)}
    .section-dot.practical{background:var(--green)}
    .section-dot.project{background:#5E9BE8}
    .section-dot.competition{background:var(--yellow)}
    .section-dot.exam{background:var(--red)}
    .countdown{font-size:13px;font-weight:600;white-space:nowrap}
    .countdown.ok{color:var(--green)}
    .countdown.warn{color:var(--yellow)}
    .countdown.bad{color:var(--red-text)}

    /* Stat tiles */
    .tile{
      display:flex;align-items:center;gap:12px;background:var(--surface);
      border:1px solid var(--separator);border-radius:var(--radius-card);padding:13px 14px;
    }
    .tile-body{min-width:0}
    .tile-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tertiary)}
    .tile-value{font-size:20px;font-weight:700;line-height:1.25;color:var(--text)}
    .tile-sub{font-size:12px;color:var(--secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* Dashboard inset rows */
    .study-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .study-name{font-weight:600;font-size:16px}
    .qbars{margin-top:10px;display:grid;gap:8px}
    .qline-head{display:flex;justify-content:space-between;font-size:13px;color:var(--secondary);margin-bottom:5px}
    .qtype-name{font-size:13px;color:var(--secondary);min-width:42px}
    .stage-pill{font-size:13px;color:var(--secondary)}

    .empty{display:grid;gap:8px;justify-items:start;padding:6px 2px 2px;font-size:13px}
    .day-head{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tertiary);margin:16px 0 8px}
    .category-counts{font-size:13px;color:var(--secondary);line-height:1.7;margin-top:12px}

    /* Skeleton loading */
    .skeleton{
      background:linear-gradient(90deg,rgba(255,255,255,0.04),rgba(255,255,255,0.09),rgba(255,255,255,0.04));
      background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:6px;
    }
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .sk-line{height:13px;margin:10px 0}
    .sk-stat,.sk-panel{height:96px}

    /* ---------- Study ---------- */
    .card.subject-card{padding:0;overflow:hidden}
    .subject-head{
      display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;
      transition:background .2s ease,opacity .2s ease;
    }
    .subject-head:hover{background:var(--surface-hover)}
    .subject-name{font-weight:600;flex:1;font-size:16px}
    .subject-pct{color:var(--accent-text);font-weight:700}
    .chev{display:inline-flex;color:var(--tertiary);transition:transform .2s ease}
    .chev.open{transform:rotate(90deg)}
    .card-body{padding:0 16px 16px;border-top:1px solid var(--separator)}
    .subblock{margin-top:16px}
    .subblock-title{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--secondary);margin-bottom:8px}
    .chapter-card{border:1px solid var(--separator);border-radius:10px;background:rgba(255,255,255,0.02);margin-top:10px;overflow:hidden}
    .chapter-head{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer;transition:background .2s ease,opacity .2s ease}
    .chapter-head:hover{background:var(--surface-hover)}
    .chapter-name{flex:1;font-size:15px}
    .number-pill{font-size:12px;color:var(--accent-text);background:rgba(10,132,255,0.16);padding:2px 8px;border-radius:6px;margin-right:4px}
    .chapter-body{padding:4px 12px 12px;border-top:1px solid var(--separator)}
    .qtype{padding:10px 0;border-bottom:1px solid var(--separator)}
    .qtype:last-of-type{border-bottom:0}
    .qtype-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
    .qtype-target{font-size:13px;color:var(--secondary);margin-left:-4px}
    .stepper{display:inline-flex;align-items:center;gap:2px;background:var(--elevated);border:1px solid var(--separator);border-radius:8px;overflow:hidden}
    .step-btn{width:30px;height:28px;border:0;background:transparent;color:var(--accent-text);font-size:18px;line-height:1;transition:background .2s ease,opacity .2s ease}
    .step-btn:hover{background:var(--surface-hover)}
    .step-val{min-width:26px;text-align:center;font-size:14px;font-weight:600}
    .stepper.target{margin-left:auto}
    .stepper.target .step-btn{color:var(--secondary);width:26px}
    .practical-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--separator)}
    .practical-row:last-child{border-bottom:0}
    .practical-row .name{flex:1;font-size:15px}
    .practical-row.done .name{text-decoration:line-through;color:var(--tertiary)}
    .practical-row .date{font-size:13px;color:var(--secondary)}

    /* Tick-style checkbox — a real checkmark, not a button or switch */
    .tick{position:relative;display:inline-flex;width:24px;height:24px;flex:0 0 auto;cursor:pointer}
    .tick input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
    .tick-box{
      width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;
      background:var(--elevated);border:1.5px solid rgba(255,255,255,0.28);
      transition:background .15s ease,border-color .15s ease;
    }
    .tick-box svg{width:15px;height:15px;opacity:0;transition:opacity .15s ease}
    .tick input:checked+.tick-box{background:var(--accent-strong);border-color:var(--accent-strong)}
    .tick input:checked+.tick-box svg{opacity:1}
    .tick input:focus-visible+.tick-box{outline:2px solid var(--accent);outline-offset:2px}

    /* ---------- Practicals: one group per subject ---------- */
    .prac-group{padding:16px}
    .prac-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .prac-head .prac-name{font-size:17px;font-weight:600}
    .prac-head .prac-count{font-size:13px;color:var(--secondary)}
    .prac-total{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--secondary);margin-bottom:10px}
    .prac-total .num{color:var(--text);font-weight:600}
    .prac-detail-info{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;font-size:13px;color:var(--secondary)}
    .completed-badge{font-size:11px;font-weight:600;color:var(--green);letter-spacing:.03em}
    .chapter-tracker-body{display:flex;align-items:center;gap:22px;padding:6px 2px}
    .tracker-big{font-size:24px;font-weight:700;line-height:1.2}
    .tracker-sub{font-size:13px;color:var(--secondary);margin-top:4px}

    /* ---------- Cards for projects / competitions / achievements ---------- */
    .item-card{padding:16px}
    .item-card .item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .item-title{font-size:17px;font-weight:600;margin:0;min-width:0;overflow-wrap:anywhere}
    .item-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
    .item-notes{font-size:14px;color:var(--secondary);margin:10px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
    .item-link{font-size:13px;margin-top:10px}
    .item-link a{color:var(--accent-text);text-decoration:none;overflow-wrap:anywhere}
    .item-link a:hover{text-decoration:underline}
    .divider-label{
      font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tertiary);
      margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--separator);
    }
    .task{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:15px;cursor:pointer}
    .task.done span{text-decoration:line-through;color:var(--tertiary)}
    .task input{width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
    .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    .tag{font-size:12px;color:var(--secondary);background:rgba(255,255,255,0.05);border:1px solid var(--separator);padding:2px 8px;border-radius:6px}
    /* ---------- Achievements: prize gallery ---------- */
    .achievement-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
    .prize-card{
      position:relative;padding:22px 18px 18px;text-align:center;overflow:hidden;
      background:var(--surface);border:1px solid var(--separator);border-radius:var(--radius-card);
    }
    .prize-card::before{
      content:"";position:absolute;inset:6px;border:1px solid rgba(255,255,255,0.06);
      border-radius:8px;pointer-events:none;
    }
    .prize-medal{
      width:58px;height:58px;margin:0 auto 14px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      background:var(--surface-hover);border:1px solid rgba(10,132,255,0.35);color:var(--accent-text);
    }
    .prize-year{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tertiary)}
    .prize-title{font-size:17px;font-weight:700;margin:5px 0 4px;line-height:1.3;overflow-wrap:anywhere}
    .prize-org{font-size:13px;color:var(--secondary)}
    .prize-desc{font-size:13px;color:var(--secondary);margin:12px 4px 0;line-height:1.5}
    .prize-card .tags,.prize-card .item-link{position:relative;justify-content:center;display:flex}
    .prize-card .row-actions{position:absolute;top:10px;right:10px}

    /* ---------- Bottom tab bar (phones) ---------- */
    .tabbar{display:none}

    /* ---------- Auth screens ---------- */
    .auth-screen{min-height:calc(100vh - var(--header-h));display:flex;align-items:center;justify-content:center;padding:24px}
    .auth-card{
      width:100%;max-width:380px;background:var(--surface);border:1px solid var(--separator);
      border-radius:var(--radius-card);padding:28px 24px;
    }
    .auth-icon{display:inline-flex;color:var(--accent-text);margin-bottom:12px}
    .auth-card h1{font-size:24px;margin:0;font-weight:700}
    .auth-card>p{margin:6px 0 22px;font-size:14px}
    .auth-card .btn{margin-top:14px}
    .auth-card .link-btn{display:block;margin:14px auto 0}
    .boot-screen{min-height:calc(100vh - var(--header-h));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
    .spinner{width:26px;height:26px;border:2px solid var(--separator);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ---------- Sheet / modal ---------- */
    .sheet-backdrop{
      position:fixed;inset:0;background:rgba(2,6,12,0.6);z-index:60;
      display:flex;align-items:center;justify-content:center;padding:20px;
      -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    }
    .sheet{
      width:100%;max-width:520px;max-height:calc(100vh - 40px);overflow-y:auto;
      background:var(--elevated);border:1px solid var(--separator);border-radius:var(--radius-card);
      box-shadow:0 18px 50px rgba(0,0,0,.45);
    }
    .sheet-head{
      display:grid;grid-template-columns:70px 1fr 70px;align-items:center;
      padding:14px 16px;border-bottom:1px solid var(--separator);position:sticky;top:0;background:var(--elevated);z-index:1;
    }
    .sheet-head h2{font-size:16px;font-weight:600;margin:0;text-align:center}
    .sheet-side{background:none;border:0;color:var(--secondary);font-size:15px;padding:6px 0;transition:opacity .2s ease}
    .sheet-side.save{color:var(--accent-text);font-weight:600;text-align:right}
    .sheet-side:active{opacity:.6}
    .sheet form{padding:18px 16px 24px}
    .sheet .action-body{padding:8px 16px 20px}
    .sheet .action-body .inset{background:var(--surface)}

    /* ---------- Error banner + toast ---------- */
    .error-banner{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      background:var(--red-soft);border-bottom:1px solid rgba(255,69,58,0.3);
      color:var(--red-text);padding:10px 16px;font-size:14px;z-index:35;
    }
    .error-banner button{background:none;border:0;color:var(--red-text);display:inline-flex;padding:4px}
    #toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;z-index:80;pointer-events:none}
    .toast{
      background:var(--elevated);border:1px solid var(--separator);color:var(--text);
      padding:11px 16px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);
      animation:toast-in .2s ease;
    }
    .toast.error{color:var(--red-text)}
    @keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

    /* ---------- Responsive: phones ---------- */
    @media (min-width:761px) and (max-width:1100px){
      .stat-row{grid-template-columns:repeat(3,minmax(0,1fr))}
    }
    @media (max-width:760px){
      :root{--header-h:52px}
      .sidebar{display:none}
      .main{padding:20px 16px calc(96px + env(safe-area-inset-bottom))}
      .grid{grid-template-columns:1fr;gap:16px}
      .dash-grid{grid-template-columns:1fr;gap:16px}
      .dash-grid .panel-wide{grid-column:auto}
      .stat-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
      .section-head{align-items:flex-start}
      .head-actions{width:100%}
      .head-actions .search{flex:1;min-width:0}

      .tabbar{
        display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;
        background:rgba(14,26,44,0.92);
        -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
        border-top:1px solid var(--separator);
        padding-bottom:env(safe-area-inset-bottom);
      }
      .tab{
        flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
        min-height:58px;background:none;border:0;color:var(--secondary);font-size:10px;

      @keyframes sheet-up{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}
    }
    @media (prefers-reduced-motion:reduce){
      *{animation-duration:.01ms !important;transition-duration:.01ms !important}

  function daysLeft(dateStr){

  function icon(name, size = 20){
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICON_PATHS[name] || '') + '</svg>';

  /* ---------- Chart primitives (SVG donut + thin bar) ---------- */
  function donut(pct, opts = {}){
    const size = opts.size || 48, stroke = opts.stroke || 6;
    const r = (size - stroke) / 2 - 1, m = size / 2, c = 2 * Math.PI * r;
    const p = clamp(pct), off = c * (1 - p / 100);
    const label = opts.label !== undefined ? opts.label : (Math.round(p) + '%');
    const fs = opts.fontSize || (size <= 42 ? 11 : 13);
    return '<svg class="donut" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" role="img" aria-label="' + Math.round(p) + ' percent">' +
      '<circle cx="' + m + '" cy="' + m + '" r="' + r + '" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="' + stroke + '"/>' +
      '<circle cx="' + m + '" cy="' + m + '" r="' + r + '" fill="none" stroke="' + (opts.color || 'var(--accent)') + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + c.toFixed(2) + '" stroke-dashoffset="' + off.toFixed(2) + '" transform="rotate(-90 ' + m + ' ' + m + ')"/>' +

  /* ---------- Feedback: toast + visible error banner ---------- */
  function toast(msg, isError){
    const el = document.createElement('div');
    el.className = 'toast' + (isError ? ' error' : '');
    el.textContent = msg;
    $('#toast-root').appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }
  function showError(msg){ $('#error-text').textContent = msg; $('#error-banner').hidden = false; }
  function clearError(){ $('#error-banner').hidden = true; }

  /* ---------- Auth ---------- */
  function applySession(session){
    const user = session && session.user ? session.user : null;
    state.user = user;
    $('#boot-screen').hidden = true;

    // Recovery link: show the set-password flow; expired if there is no session.
    if(state.recoveryMode){
      $('#recovery-valid').hidden = !user;
      $('#recovery-expired').hidden = !!user;
      $('#recovery-screen').hidden = false;
      $('#login-screen').hidden = true;

    const loggedIn = !!user;
    $('#login-screen').hidden = loggedIn;

    if(loggedIn){
      if(lastLoadedUserId !== user.id){

  // Keep "Wrong password" for the common case, but surface every other auth error
  // (missing account, unconfirmed email, rate limit, network) instead of hiding it.
  let signingIn = false;
  $('#login-form').addEventListener('submit', async e => {
    e.preventDefault();
    if(signingIn) return;
    signingIn = true;
    const pass = $('#login-password').value;
    const err = $('#login-error'); err.textContent = '';
    $('#login-notice').hidden = true;
    clearError();
    try{
      const {error} = await supabase.auth.signInWithPassword({email:CONFIG.LOGIN_EMAIL,password:pass});
      if(error){
        console.warn('[YoushaLab] sign-in error:', error);

        if(error.code === 'invalid_credentials' || /invalid login credentials/i.test(msg)){
          err.textContent = 'Wrong password';
        }else{
          err.textContent = 'Sign in failed: ' + msg;

        $('#login-password').value = '';

    }catch(ex){
      console.warn('[YoushaLab] sign-in exception:', ex);
      showError('Sign in failed: ' + (ex.message || 'Network error. Check your connection.'));
      err.textContent = 'Could not reach the server.';
    }finally{ signingIn = false; }
  });
  $('#recovery-form').addEventListener('submit', async e => {
    e.preventDefault();
    const p1 = $('#new-password').value, p2 = $('#confirm-password').value, err = $('#recovery-error');
    err.textContent = '';
    if(p1.length < 6){ err.textContent = 'Use at least 6 characters.'; return; }
    if(p1 !== p2){ err.textContent = 'Passwords do not match.'; return; }
    const {error} = await supabase.auth.updateUser({password:p1});

  /* ==========================================================================
     DATA LAYER — every query is scoped to the current user
     ========================================================================== */
  async function refreshData(opts){
    opts = opts || {};
    if(!state.user) return;
    if(!opts.silent){ state.loading = true; renderCurrent(); }
    clearError();
    const {data, error} = await supabase.from('entries').select('*').eq('user_id', state.user.id);
    if(error){ state.entries = []; showError('Could not load your data: ' + error.message); }
    else { state.entries = data || []; }
    state.loading = false;
    renderCurrent();
  }
  // Re-render the active section instantly, preserving a focused search field.
  function quickRender(){
    const active = document.activeElement;
    const key = active && active.dataset ? active.dataset.search : null;
    const caret = key ? active.selectionStart : null, value = key ? active.value : null;
    renderCurrent();
    if(key){
      const el = document.querySelector('[data-search="' + key + '"]');
      if(el){
        el.focus();
        if(value !== null) el.value = value;
        if(caret !== null){ try{ el.setSelectionRange(caret,caret); }catch(_){} }
      }
    }
  }
  // Background write: the UI has already updated; only refetch if the write fails.
  function persist(id, data){
    patchData(id,data).catch(err => { showError('Could not update: ' + (err.message || err)); refreshData(); });
  }
  // Edits apply locally at once; inserts use a single round trip with no full refetch.
  function saveEntry(payload, id){
    if(id){
      const e = byId(id);
      if(e) Object.assign(e,payload);
      closeSheet(); quickRender(); toast('Changes saved');
      supabase.from('entries').update(payload).eq('id',id).eq('user_id',state.user.id)
        .then(({error}) => { if(error) throw error; })
        .catch(err => { showError('Could not save: ' + (err.message || err)); refreshData(); });
    }else{
      closeSheet();
      supabase.from('entries').insert(Object.assign({user_id:state.user.id},payload)).select().single()
        .then(({data,error}) => {
          if(error) throw error;
          if(data && data.id && !byId(data.id)) state.entries.push(data);
          quickRender(); toast('Added');
        })
        .catch(err => { showError('Could not save: ' + (err.message || err)); refreshData(); });
    }
  }
  async function patchData(id, data){
    const {error} = await supabase.from('entries').update({data:data}).eq('id', id).eq('user_id', state.user.id);
    if(error) throw error;
  }
  function removeEntry(id){
    if(!window.confirm('Delete this item? This cannot be undone.')) return;
    const children = state.entries.filter(x => x.parent_id === id).map(x => x.id);
    state.entries = state.entries.filter(x => x.id !== id && x.parent_id !== id);
    if(pracDetailSubjectId === id) closeSheet();
    else { quickRender(); reopenPracticalDetail(); }
    const del = tid => supabase.from('entries').delete().eq('id',tid).eq('user_id',state.user.id);
    Promise.all(children.map(del).concat([del(id)]))
      .then(results => { const bad = results.find(r => r && r.error); if(bad) throw bad.error; toast('Deleted'); })
      .catch(err => { showError('Could not delete: ' + (err.message || err)); refreshData(); });
  }

  /* ---------- Computed progress ---------- */
  // A chapter has three tickable parts. All three ticked = chapter completed.
  function chapterStats(ch){
    const d = ch.data || {};
    const parts = {cq:!!d.cq, mcq:!!d.mcq, short:!!d.short};
    const done = ['cq','mcq','short'].filter(k => parts[k]).length;
    return {parts,target:3,done,pct:clamp(done / 3 * 100),complete:done === 3};
  }
  // Total chapters finished across every subject (for the dashboard tracker).
  function chapterCompletion(){
    const chapters = state.entries.filter(e => e.section === 'chapter');
    const done = chapters.filter(ch => chapterStats(ch).complete).length;
    return {done,total:chapters.length,pct:chapters.length ? clamp(done / chapters.length * 100) : 0};
  }
  function subjectStats(s){
    const chapters = kids(s.id, 'chapter');
    let target = 0, done = 0;
    chapters.forEach(ch => { const st = chapterStats(ch); target += st.target; done += st.done; });
    const practicals = kids(s.id, 'practical');
    const doneCount = practicals.length ? practicals.filter(p => p.data && p.data.done).length : num(s.data && s.data.practicalDone);
    const total = num(s.data && s.data.practicalTotal);
    return {chapters,practicals,target,done,pct:target ? clamp(done / target * 100) : 0,doneCount,total,
      practicalPct:total ? clamp(doneCount / total * 100) : 0};
  }
  // Average of subject completion percentages (distinct from the aggregate tracker).
  function overallStudyPct(){
    const subjects = state.entries.filter(e => e.section === 'subject');
    if(!subjects.length) return 0;
    return clamp(subjects.reduce((a,s) => a + subjectStats(s).pct, 0) / subjects.length);
  }
  // Aggregate tick counts per question type across a subject's chapters.
  function questionTotals(st){
    const agg = {cq:{t:0,d:0},mcq:{t:0,d:0},short:{t:0,d:0}};
    st.chapters.forEach(ch => {
      const parts = chapterStats(ch).parts;
      ['cq','mcq','short'].forEach(k => { agg[k].t += 1; if(parts[k]) agg[k].d += 1; });
    });
    return agg;
  }
  // Everything due within 30 days: chapter targets, exam dates, practicals, project + competition deadlines.
  function buildUpcoming(){
    const out = [];
    const add = (date,label,section,tab,id) => {
      const n = daysLeft(date);
      if(n !== null && n >= 0 && n <= 30) out.push({date,label,section,tab,id,days:n});
    };
    state.entries.forEach(e => {
      if(e.section === 'chapter'){
        add(e.date,(e.title || 'Chapter') + ' · target','chapter','study',e.id);
        if(e.data && e.data.exam) add(e.data.exam,(e.title || 'Chapter') + ' · exam','exam','study',e.id);
      }
      if(e.section === 'practical') add(e.date,(e.title || 'Practical') + ' · practical','practical','practicals',e.id);
      if(e.section === 'project') add(e.date,(e.title || 'Project') + ' · deadline','project','projects',e.id);
      if(e.section === 'competition'){
        add(e.date,(e.title || 'Competition') + ' · submission','competition','competitions',e.id);
        if(e.data && e.data.registration) add(e.data.registration,(e.title || 'Competition') + ' · registration','competition','competitions',e.id);
      }
    });
    return out.sort((a,b) => a.date.localeCompare(b.date));
  }

  // Open a row's detail in its own section and highlight it.

  /* ---------- Form + sheet helpers ---------- */
  function fText(label,name,value,extra){

  /* ==========================================================================

  function statTile(label, value, sub, pct, centerLabel, color){
    return '<div class="tile">' + donut(pct,{size:50,stroke:6,label:centerLabel,color:color,fontSize:13}) +
      '<div class="tile-body"><div class="tile-label">' + esc(label) + '</div>' +
      '<div class="tile-value">' + value + '</div><div class="tile-sub">' + sub + '</div></div></div>';

  function skeletonDashboard(){
    let s = '<div class="skeleton sk-line" style="width:220px;height:30px"></div><div class="skeleton sk-line" style="width:300px"></div><div class="stat-row">';
    for(let i=0;i<5;i++) s += '<div class="skeleton sk-stat"></div>';
    s += '</div><div class="dash-grid">';
    for(let i=0;i<4;i++) s += '<div class="panel"><div class="skeleton sk-line" style="width:45%"></div><div class="skeleton sk-line"></div><div class="skeleton sk-line" style="width:80%"></div></div>';
    return s + '</div>';

  function renderDashboard(){
    const root = $('#section-root');
    if(state.loading){ root.innerHTML = skeletonDashboard(); return; }

    const subjects = state.entries.filter(e => e.section === 'subject');
    const projects = state.entries.filter(e => e.section === 'project');
    const competitions = state.entries.filter(e => e.section === 'competition');
    const achievements = state.entries.filter(e => e.section === 'achievement');

    const h = new Date().getHours();
    const greeting = h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening';
    const today = new Date().toLocaleDateString(undefined, {weekday:'long',month:'long',day:'numeric',year:'numeric'});
    const upcoming = buildUpcoming();
    const dueWeek = upcoming.filter(it => it.days <= 7).length;

    let html = '<div class="section-head"><div><h1 class="large-title">Good ' + greeting + '</h1>' +

    // Summary row: compact tiles, each with a small donut + value.
    const overall = overallStudyPct();
    const chapters = chapterCompletion();
    const projAvg = projects.length ? projects.reduce((a,p) => a + num(STAGE_PCT[(p.data||{}).stage]), 0) / projects.length : 0;
    const activeComps = competitions.filter(c => (c.data||{}).status !== 'result');
    const nextComp = activeComps.slice().sort((a,b) => (daysLeft(a.date) ?? 9999) - (daysLeft(b.date) ?? 9999))[0];

      statTile('Projects average',Math.round(projAvg) + '%',projects.length + ' project' + (projects.length === 1 ? '' : 's'),projAvg,Math.round(projAvg) + '%') +
      statTile('Active competitions',String(activeComps.length),nextComp ? 'Next: ' + esc(nextComp.title) : 'No deadlines',nextComp ? num(STATUS_PCT[(nextComp.data||{}).status]) : 0,String(activeComps.length)) +

  /* ==========================================================================
     STUDY — subjects > chapters + practicals
     ========================================================================== */
  function renderStudy(){
    $('#section-root').innerHTML =
      '<div class="section-head"><div><h1 class="large-title">Study</h1><p class="section-sub">Subjects, chapters, questions and practicals</p></div>' +
      '<div class="head-actions"><input class="search" data-search="study" placeholder="Search study…" value="' + esc(state.search.study) + '"><button class="btn primary" data-action="add-subject">' + icon('plus',17) + ' Subject</button></div></div>' +
      '<div id="study-list"></div>';

  function renderStudyList(){
    const q = state.search.study.trim().toLowerCase();
    let subjects = state.entries.filter(e => e.section === 'subject');
    if(q) subjects = subjects.filter(s => s.title.toLowerCase().includes(q) ||

  function addPracticalInline(id){
    const name = ($('#prac-new-name') || {}).value;
    if(!name || !name.trim()){ showError('Enter a practical name.'); return; }
    supabase.from('entries').insert({section:'practical',title:name.trim(),
      date:$('#prac-new-date').value || null,parent_id:id,data:{done:false},user_id:state.user.id}).select().single()
      .then(({data,error}) => {
        if(error) throw error;
        if(data && data.id && !byId(data.id)) state.entries.push(data);
        const subject = byId(id);
        if(subject){
          const doneCount = kids(id,'practical').filter(x => x.data && x.data.done).length;
          subject.data = Object.assign({},subject.data,{practicalDone:doneCount});
          persist(id,subject.data);
        }
        quickRender(); reopenPracticalDetail(); toast('Practical added');
      })
      .catch(err => { showError('Could not add: ' + (err.message || err)); refreshData(); });

      fDate('Date','date',a && a.date ? a.date : '') + fText('Organization','organization',d.organization || '') +
      fText('Proof link','proofLink',d.proofLink || '', 'placeholder="https://…"') +
      fText('Tags (comma separated)','tags',(d.tags || []).join(', ')) + fArea('Description','description',d.description || '') + '</div>',
      fd => saveEntry({section:'achievement',title:fd.get('title').trim(),date:fd.get('date') || null,parent_id:null,
        data:{category:fd.get('category'),organization:fd.get('organization').trim(),description:fd.get('description').trim(),
          proofLink:fd.get('proofLink').trim(),tags:fd.get('tags').split(',').map(t => t.trim()).filter(Boolean)}},a ? a.id : null));
  }

  /* ==========================================================================
     SETTINGS — grouped-list rows for Export / Import
     ========================================================================== */
  function renderSettings(){
    $('#section-root').innerHTML =
      '<div class="section-head"><div><h1 class="large-title">Settings</h1><p class="section-sub">Back up and restore your data</p></div></div>' +
      '<div class="group-label">Data</div><div class="inset">' +
        '<button class="inset-row tappable" data-action="export">' + icon('download',19) + '<span class="row-main">Export all data</span><span class="chev">' + icon('chevron',16) + '</span></button>' +
        '<button class="inset-row tappable" data-action="import">' + icon('upload',19) + '<span class="row-main">Import from JSON file</span><span class="chev">' + icon('chevron',16) + '</span></button>' +
      '</div>' +
      '<div class="group-label">Privacy</div><div class="inset"><div class="inset-row static">' + icon('lock',19) + '<span class="row-main muted small">Your data lives only in your private Supabase table — never in browser storage.</span></div></div>';
  }
  function exportData(){
    const payload = {app:'YoushaLab',exportedAt:new Date().toISOString(),user_id:state.user.id,entries:state.entries};
    const blob = new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'youshalab-backup-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    toast('Backup downloaded');
  }
  // Import recreates every entry with a fresh id and re-links parent_id references.
  async function importData(rows){
    if(!Array.isArray(rows) || !rows.length){ showError('That file contains no entries.'); return; }
    if(!window.confirm('Import ' + rows.length + ' entries? Existing data will be kept.')) return;
    const idMap = new Map(), ids = new Set(rows.map(r => r.id));
    let pending = rows.slice(), guard = 0;
    try{
      clearError();
      while(pending.length && guard++ < rows.length + 2){
        const next = [];
        for(const r of pending){
          if(r.parent_id && ids.has(r.parent_id) && !idMap.has(r.parent_id)){ next.push(r); continue; }
          const parent = r.parent_id ? (idMap.has(r.parent_id) ? idMap.get(r.parent_id) : r.parent_id) : null;
          const {data,error} = await supabase.from('entries').insert({section:r.section,title:r.title || '',date:r.date || null,
            parent_id:parent,data:(r.data && typeof r.data === 'object') ? r.data : {},user_id:state.user.id}).select().single();
          if(error) throw error;
          if(r.id != null && data && data.id) idMap.set(r.id,data.id);
        }
        if(next.length === pending.length){ // unresolvable/circular parents: insert as-is
          for(const r of next){
            const {data,error} = await supabase.from('entries').insert({section:r.section,title:r.title || '',date:r.date || null,
              parent_id:r.parent_id || null,data:(r.data && typeof r.data === 'object') ? r.data : {},user_id:state.user.id}).select().single();
            if(error) throw error;
            if(r.id != null && data && data.id) idMap.set(r.id,data.id);
          }
          break;
        }
        pending = next;
      }
      toast('Imported ' + rows.length + ' entries');
      await refreshData();
    }catch(err){ showError('Import failed: ' + (err.message || err)); }
  }

  /* ==========================================================================
     EVENTS
     ========================================================================== */
  function openMoreSheet(){
    openActionSheet('More',
      '<div class="group-label">Navigate</div><div class="inset">' +
        '<button class="inset-row tappable" data-action="tab" data-tab="practicals">' + icon('list',19) + '<span class="row-main">Practicals</span></button>' +
        '<button class="inset-row tappable" data-action="tab" data-tab="achievements">' + icon('award',19) + '<span class="row-main">Achievements</span></button>' +
        '<button class="inset-row tappable" data-action="tab" data-tab="settings">' + icon('settings',19) + '<span class="row-main">Settings</span></button>' +
      '</div><div class="group-label">Account</div><div class="inset">' +
        '<button class="inset-row tappable" data-action="logout" style="color:var(--red-text)">' + icon('logout',19) + '<span class="row-main">Logout</span></button>' +
      '</div>');
  }
  document.addEventListener('click', e => {
    if(e.target.matches('[data-backdrop]')){ closeSheet(); return; }
    if(e.target.closest('input,select,textarea')) return; // let change handlers own form controls
    const el = e.target.closest('[data-action]'); if(!el) return;
    const a = el.dataset.action, id = num(el.dataset.id);
    switch(a){
      case 'dismiss-error': clearError(); break;
      case 'close-sheet': closeSheet(); break;
      case 'forgot': case 'request-reset': requestReset(); break;
      case 'back-login': backToLogin(); break;
      case 'logout': supabase.auth.signOut(); break;
      case 'tab': switchTab(el.dataset.tab); break;
      case 'more': openMoreSheet(); break;
      case 'goto': gotoItem(el.dataset.tab,id); break;
      case 'filter':
        state.achFilter[el.dataset.key] = el.dataset.value;
        renderAchievements(); break;

      case 'add-subject': subjectForm(null); break;
      case 'add-chapter': chapterForm(null,id); break;
      case 'open-prac-detail': openPracticalDetail(id); break;
      case 'add-practical-inline': addPracticalInline(id); break;
      case 'add-project': projectForm(null); break;
      case 'add-competition': competitionForm(null); break;
      case 'add-achievement': achievementForm(null); break;

      case 'edit-subject': subjectForm(byId(id)); break;
      case 'edit-chapter': { const c = byId(id); chapterForm(c,c ? c.parent_id : null); break; }
      case 'edit-practical': { const p = byId(id); practicalForm(p,p ? p.parent_id : null); break; }
      case 'edit-project': projectForm(byId(id)); break;
      case 'edit-competition': competitionForm(byId(id)); break;
      case 'edit-achievement': achievementForm(byId(id)); break;
      case 'delete': removeEntry(id); break;

      case 'toggle-subject':
        state.expanded.subjects.has(id) ? state.expanded.subjects.delete(id) : state.expanded.subjects.add(id);
        renderStudyList(); break;
      case 'toggle-chapter':
        state.expanded.chapters.has(id) ? state.expanded.chapters.delete(id) : state.expanded.chapters.add(id);
        renderStudyList(); break;
      case 'prac-total': adjustPracticalTotal(id,num(el.dataset.delta)); break;

      case 'export': exportData(); break;
      case 'import': $('#import-file').click(); break;
    }
  });
  document.addEventListener('submit', e => {
    if(e.target.id === 'sheet-form'){
      e.preventDefault();
      if(modalSubmit) modalSubmit(new FormData(e.target));
    }
  });
  document.addEventListener('input', e => {
    const key = e.target.dataset.search; if(!key) return;
    state.search[key] = e.target.value;
    ({study:renderStudyList,practicals:renderPracticalsList,projects:renderProjectsList,competitions:renderCompetitionsList,achievements:renderAchievementsList})[key]();
  });
  document.addEventListener('change', e => {
    const a = e.target.dataset.action;
    if(a === 'toggle-practical'){ togglePractical(num(e.target.dataset.id),e.target.checked); return; }
    if(a === 'toggle-chapter-part'){ toggleChapterPart(num(e.target.dataset.id),e.target.dataset.type,e.target.checked); return; }
    if(a === 'toggle-task'){ toggleTask(num(e.target.dataset.id),num(e.target.dataset.index),e.target.checked); return; }
    if(e.target.id === 'import-file'){
      const file = e.target.files && e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try{ const parsed = JSON.parse(reader.result); importData(Array.isArray(parsed) ? parsed : parsed.entries); }
        catch(err){ showError('Could not read that JSON file: ' + err.message); }
      };
      reader.readAsText(file); e.target.value = '';
    }
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

  /* ---------- Quick mutations ---------- */
  // Tick/untick one of a chapter's three question types.
  function toggleChapterPart(id, type, checked){
    const e = byId(id); if(!e || !['cq','mcq','short'].includes(type)) return;
    e.data = Object.assign({},e.data,{[type]:checked});
    quickRender();
    persist(id,e.data);
  }
  function adjustPracticalTotal(id, delta){
    const e = byId(id); if(!e) return;
    e.data = Object.assign({},e.data,{practicalTotal:Math.max(0,num(e.data && e.data.practicalTotal) + delta)});
    quickRender(); reopenPracticalDetail();
    persist(id,e.data);
  }
  function togglePractical(id, checked){
    const p = byId(id); if(!p) return;
    p.data = Object.assign({},p.data,{done:checked});
    if(p.parent_id){
      const subj = byId(p.parent_id);
      if(subj){
        const doneCount = kids(p.parent_id,'practical').filter(x => x.id === id ? checked : !!(x.data && x.data.done)).length;
        subj.data = Object.assign({},subj.data,{practicalDone:doneCount});
        persist(subj.id,subj.data);
      }
    }
    quickRender(); reopenPracticalDetail();
    persist(id,p.data);
  }
  function toggleTask(id, index, checked){
    const e = byId(id); if(!e) return;
    const d = JSON.parse(JSON.stringify(e.data || {}));
    d.tasks = d.tasks || [];
    if(d.tasks[index]) d.tasks[index].done = checked;
    e.data = d;
    quickRender();
    persist(id,d);
  }

  /* ---------- Boot ---------- */
  buildNav();
  </script>
</body>
